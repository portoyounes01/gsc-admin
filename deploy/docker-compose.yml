name: gsc-admin

# Only the proxy publishes ports (80/443). The database and API stay on the internal network.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      ROUTING_OUTBOUND_ENABLED: ${ROUTING_OUTBOUND_ENABLED:-true}
      ROUTING_OSRM_BASE_URL: ${ROUTING_OSRM_BASE_URL:-http://osrm:5000}
    depends_on:
      db:
        condition: service_healthy

  # Road-network routing on Belgian OpenStreetMap data. Run ./osrm-prepare.sh once before first start.
  # If it is down, the backend falls back to its built-in distance estimate.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 100 /data/belgium-latest.osrm
    volumes:
      - ./osrm-data:/data:ro

  frontend:
    build:
      context: ../frontend
      target: production
      args:
        VITE_API_URL: https://${API_HOST}
        VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    restart: unless-stopped

  proxy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
