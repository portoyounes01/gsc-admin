# Local development only; see docs/security-hardening.md for production requirements.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gsc_dashboard
      POSTGRES_USER: gsc
      POSTGRES_PASSWORD: gsc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsc -d gsc_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://gsc:gsc@db:5432/gsc_dashboard}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_ABSOLUTE_MINUTES: ${SESSION_ABSOLUTE_MINUTES:-480}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PLANNING_RETENTION_DAYS: ${PLANNING_RETENTION_DAYS:-365}
      GEOCODING_OUTBOUND_ENABLED: ${GEOCODING_OUTBOUND_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://backend:8000
      VITE_CARTO_BASEMAP_KEY: ${VITE_CARTO_BASEMAP_KEY:-}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  frontend_node_modules:
